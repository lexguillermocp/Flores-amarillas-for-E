<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Para Ela</title>
 <style>
 body {
 margin: 0;
 padding: 0;
 height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 background: #fff8e1;
 font-family: 'Arial', sans-serif;
 overflow: hidden;
 text-align: center;
 }

 .container {
 background: rgba(255, 255, 255, 0.9);
 padding: 40px;
 border-radius: 20px;
 box-shadow: 0 10px 30px rgba(0,0,0,0.1);
 max-width: 500px;
 z-index: 10;
 border: 2px solid #ffd54f;
 }

 .flowers {
 font-size: 80px;
 margin-bottom: 20px;
 display: block;
 }

 h1 {
 color: #ff8f00;
 font-family: 'Georgia', serif;
 margin-bottom: 20px;
 }

 p {
 color: #5d4037;
 font-size: 1.2rem;
 line-height: 1.6;
 margin: 0;
 }

 .signature {
 font-weight: bold;
 display: block;
 margin-top: 15px;
 color: #e65100;
 font-size: 1.3rem;
 }

 .heart {
 color: #ff5252;
 margin-top: 15px;
 display: block;
 font-size: 1.5rem;
 }

 @keyframes float {
 0% { transform: translateY(0px); }
 50% { transform: translateY(-10px); }
 100% { transform: translateY(0px); }
 }

 .flower-float {
 animation: float 3s ease-in-out infinite;
 display: inline-block;
 }
 </style>
</head>
<body>

 <div class="container">
 <span class="flowers flower-float">🌻🌼🌻</span>
 <h1>Para Ela:</h1>
 <p>
 Eres luz, amor y cariño en todo lo que haces, y de verdad mereces lo mejor del mundo. Gracias por ser tú conmigo, y recuerda que siempre puedes contar conmigo.
 </p>
 <span class="signature">De Lex.</span>
 <span class="heart">💛</span>
 </div>

</body>
</html>
